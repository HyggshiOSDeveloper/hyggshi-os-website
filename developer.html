<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portal – Hyggshi OS</title>
    <link rel="icon" href="Resources/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="Resources/upscalemedia-transformed.png" alt="Hyggshi OS Logo">
                    <span>Hyggshi OS</span>
                </div>
                <nav class="nav">
                    <ul class="nav-menu">
                        <li><a href="index.html" class="nav-link">Home</a></li>
                        <li><a href="About.html" class="nav-link">About</a></li>
                        <li><a href="projects.html" class="nav-link">Projects</a></li>
                        <li><a href="History.html" class="nav-link">History</a></li>
                        <li><a href="news.html" class="nav-link">News</a></li>
                        <li><a href="download.html" class="nav-link">Download</a></li>
                    </ul>
                </nav>
                <button class="theme-toggle" title="Toggle theme">
                    <span class="toggle-icon"></span>
                </button>
            </div>
        </div>
    </header>

    <main class="container"
        style="text-align: center; min-height: 65vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div class="feature-card" style="max-width: 600px; padding: var(--space-3xl) var(--space-2xl); align-items: center;">
            <div class="feature-icon" style="width: 64px; height: 64px; border-radius: var(--radius-2xl); margin-bottom: var(--space-md);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 32px; height: 32px;">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
            </div>
            <div class="news-badge" style="border-color: rgba(245, 158, 11, 0.3); color: #f59e0b; background: rgba(245, 158, 11, 0.1); margin-bottom: var(--space-sm);">
                <span class="status-dot"></span>
                <span>Under Construction</span>
            </div>
            <h1 class="section-title" style="font-size: var(--text-3xl);">Developer Portal</h1>
            <p style="color: var(--c-text-secondary); font-size: var(--text-base); margin: var(--space-md) auto var(--space-xl) auto; line-height: 1.7;">
                Official SDKs, module specifications, and API documentation are currently being finalized.
            </p>
            <div class="hero-actions" style="justify-content: center; gap: var(--space-md); width: 100%;">
                <a href="index.html" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Back to Home</span>
                </a>
                <a href="HOSRT.html" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                    <span>Explore HOSRT Tools</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer-text">© 2024 - 2026 Hyggshi OS Project Center.</p>
        </div>
    </footer>
    <script src="theme.js"></script>
</body>

</html>
